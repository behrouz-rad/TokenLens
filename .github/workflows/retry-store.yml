name: Retry Chrome Web Store

# Resumes the Chrome Web Store part of a release whose git tag and GitHub Release already exist
# but whose store upload or submission failed. The GitHub Release is the source of truth: its
# package is downloaded, verified again (checksum, structure, manifest version, provenance) and
# only then uploaded or submitted. Nothing is built, tagged or released here. The store is
# inspected before any change: a version that is already submitted or published is left alone,
# another version in flight stops the run, and an unsubmitted draft is replaced only with the
# explicit replace_draft acknowledgement, because the API cannot show what a draft contains.
# Procedure and recovery states: docs/release.md ("Retrying the Chrome Web Store step"); ADR 0005.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to retry, e.g. 1.0.0 (tag vX.Y.Z and its GitHub Release must already exist)'
        required: true
        type: string
      store:
        description: 'Chrome Web Store action to resume for that version'
        required: true
        type: choice
        default: upload-only
        options:
          - upload-only
          - submit-for-review
          - submit-staged
      replace_draft:
        description: 'Allow uploading the released package, which replaces any unsubmitted draft in the Developer Dashboard (the API cannot show what a draft contains). Off: only report when the version is already submitted or published.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Shares the Release workflow's group so the store is never touched by two runs at once.
concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: 24

jobs:
  verify-release:
    name: Verify the released package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.fetch.outputs.tag }}
      zip_name: ${{ steps.fetch.outputs.zip_name }}
      sha256: ${{ steps.fetch.outputs.sha256 }}
    steps:
      - name: Require the protected main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Store retries run from main only (got ${{ github.ref }})."
          exit 1
      - name: Require an authorised publisher
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          ALLOWED: ${{ vars.RELEASE_PUBLISHERS }}
        run: |
          if [ "$ACTOR" = "$OWNER" ]; then exit 0; fi
          case ",${ALLOWED// /}," in
            *",$ACTOR,"*) exit 0 ;;
          esac
          echo "::error::$ACTOR is not allowed to run store retries. Only the repository owner or logins listed in the RELEASE_PUBLISHERS variable may."
          exit 1
      - name: Check the requested store action
        env:
          STORE: ${{ inputs.store }}
        run: |
          case "$STORE" in
            upload-only|submit-for-review|submit-staged) ;;
            *) echo "::error::store must be upload-only, submit-for-review or submit-staged (got $STORE)."; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Inputs reach the shell through environment variables, never through expression
      # interpolation, so a crafted value cannot become shell syntax. The script validates the
      # version format, finds the GitHub Release for tag v<version>, downloads its assets and
      # verifies checksum, package structure, manifest version and provenance before anything
      # is kept.
      - name: Download and verify the release assets
        id: fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/release/fetch-release.mjs --version "$VERSION" --repository "$REPOSITORY" --out release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TokenLens-v${{ inputs.version }}-released
          path: release
          retention-days: 14
          if-no-files-found: error

  chrome-web-store:
    name: Chrome Web Store
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Same protected environment as the Release workflow: store identifiers and (optionally)
    # required reviewers.
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require store configuration
        env:
          PUBLISHER: ${{ vars.CWS_PUBLISHER_ID }}
          ITEM: ${{ vars.CWS_EXTENSION_ID }}
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
        run: |
          missing=""
          [ -n "$PUBLISHER" ] || missing="$missing CWS_PUBLISHER_ID"
          [ -n "$ITEM" ] || missing="$missing CWS_EXTENSION_ID"
          [ -n "$PROVIDER" ] || missing="$missing GCP_WORKLOAD_IDENTITY_PROVIDER"
          [ -n "$ACCOUNT" ] || missing="$missing CWS_SERVICE_ACCOUNT"
          if [ -n "$missing" ]; then
            echo "::error::Chrome Web Store publishing is not configured. Missing environment variables:$missing. See docs/release.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TokenLens-v${{ inputs.version }}-released
          path: release
      # The bytes handed to the store must still be the verified release package.
      - name: Verify the artifact is the released package
        env:
          ZIP_NAME: ${{ needs.verify-release.outputs.zip_name }}
          SHA256: ${{ needs.verify-release.outputs.sha256 }}
          VERSION: ${{ inputs.version }}
        run: node scripts/release/verify-package.mjs --zip "release/$ZIP_NAME" --version "$VERSION" --sha256 "$SHA256" --checksum "release/$ZIP_NAME.sha256"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Short-lived token through Workload Identity Federation: no service-account key is stored anywhere.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 1200s
          create_credentials_file: false
      - name: Reconcile with the store, then upload or submit
        id: store
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PUBLISHER: ${{ vars.CWS_PUBLISHER_ID }}
          ITEM: ${{ vars.CWS_EXTENSION_ID }}
          ZIP_NAME: ${{ needs.verify-release.outputs.zip_name }}
          VERSION: ${{ inputs.version }}
          STORE: ${{ inputs.store }}
          REPLACE_DRAFT: ${{ inputs.replace_draft }}
        run: >
          node scripts/release/cws-recover.mjs
          --publisher "$PUBLISHER"
          --item "$ITEM"
          --zip "release/$ZIP_NAME"
          --expect-version "$VERSION"
          --action "$STORE"
          --replace-draft "$REPLACE_DRAFT"
